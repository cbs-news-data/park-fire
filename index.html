<meta name="viewport" content="width=device-width, initial-scale=1" />
<link
  rel="stylesheet"
  href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css"
/>
<script
  type="text/javascript"
  src="https://pym.nprapps.org/pym.v1.min.js"
></script>
<link
  rel="stylesheet"
  href="https://unpkg.com/maplibre-gl@2.3.0/dist/maplibre-gl.css"
/>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
/>

<!-- Fonts -->
<link rel="stylesheet" href="https://use.typekit.net/rdn8fde.css" />
<style>
  @font-face {
    font-family: "Publico Headline";
    src: url("fonts/PublicoHeadline-Black.woff2") format("woff2"),
      url("fonts/PublicoHeadline-Black.woff") format("woff");
  }

  body {
    margin: 0 !important;
  }

  a {
    text-decoration: none;
    color: inherit;
  }
  #container {
    display: flex;
    flex-direction: column;
    height: 200vh;
  }
  #header {
    z-index: 1;
    max-width: 600px;
  }
  .title {
    font-family: "Publico Headline", Georgia, serif;
    line-height: 34px;
    font-size: 32px;
    color: rgb(0, 0, 0);
  }
  .description {
    font-family: "proxima-nova", sans-serif;
    font-size: 16px;
    line-height: 1.3;
    max-width: 600px;
    margin-top: 12px;
  }
  #slider-container {
    max-width: 600px;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 20px;
  }
  #slider-label {
    font-size: 20px;
    font-family: "proxima-nova", sans-serif;
    font-weight: bold;
    margin-bottom: 5px;
    text-align: center;
    width: 100%;
  }
  #slider-wrapper {
    display: flex;
    align-items: center;
    width: 100%;
    max-width: 500px;
  }
  #slider {
    width: calc(100% - 80px); /* Adjusted width to make room for the button */
    text-align: center;
    -webkit-appearance: none; /* Override default CSS styles */
    background: #d4d4d4; /* Slider Track color */
    border-radius: 50px;
    height: 10px;
    margin-right: 10px;
  }
  #slider::-webkit-slider-thumb {
    -webkit-appearance: none; /* Override default CSS styles */
    appearance: none;
    width: 20px; /* Width of the thumb */
    height: 20px; /* Height of the thumb */
    border-radius: 10px;
    background: #a5091e; /* Thumb color */
    cursor: pointer; /* Cursor on hover */
  }
  #slider:focus {
    outline: none; /* Removes the outline */
  }
  #map {
    flex-grow: 1;
    max-height: 800px;
    max-width: 600px;
    margin-bottom: 12px;
  }

  /* MEDIA QUERY */
  @media (max-width: 430px) {
    #map {
      max-height: 900px !important;
    }
    .description {
      margin-bottom: 5px;
    }
    #slider::-webkit-slider-thumb {
      width: 35px;
      height: 35px;
      border-radius: 50%;
    }

    #slider {
      width: 100%;
      max-width: 500px;
      text-align: center;
      -webkit-appearance: none; /* Override default CSS styles */
      background: #d4d4d4; /* Slider Track color */
      border-radius: 50px;
      height: 15px;
    }
    #slider-label {
      margin-bottom: 5px;
    }
  }
  .mapboxgl-ctrl-compass {
    display: none !important;
  }

  .play-pause-button {
    background-color: #a5091e;
    color: #fff;
    font-family: Proxima Nova, sans-serif;
    font-size: 16px;
    padding: 8px 16px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
    margin-right: 12px;
  }
  .play-pause-button:hover {
    background-color: #85071b;
  }

  .fa-play {
    width: 10px;
    /* center icon vertically */
    position: relative;
    right: 4px;
  }
  .source {
    font-family: "proxima-nova", sans-serif;
    color: rgb(130, 130, 130);
    font-size: 14px;
  }

  .note {
    font-family: "proxima-nova", sans-serif;
    font-size: 16px;
    color: #202022;
    width: 600px;
  }
</style>

<div id="container">
  <div id="header">
    <div class="title">How Park Fire grew</div>
    <p class="description">TKTK</p>
  </div>
  <div id="slider-container">
    <label for="slider" id="slider-label">1950s</label>
    <div id="slider-wrapper">
      <button id="play-pause" class="play-pause-button">
        <i class="fas fa-play"></i>
      </button>

      <input
        id="slider"
        type="range"
        min="1950"
        max="2070"
        step="10"
        value="1950"
      />
    </div>
  </div>
  <div id="map"></div>
  <div class="note">Note: Fire progression as of Aug. 12 at XX PST.</div>
  <div class="source">
    Source:
    <a href="#" target="_blank">CalFire</a>
  </div>
</div>
<div id="tooltip"></div>

<script src="https://unpkg.com/maplibre-gl@2.3.0/dist/maplibre-gl.js"></script>
<script>
  const map = new maplibregl.Map({
    container: "map", // container id
    style: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json", // style URL
    center: [-121.8047, 40.076], // starting position [lng, lat]
    zoom: 9,
    maxZoom: 10,
    minZoom: 3,
    hash: true,
  });

  // Disable scroll zoom
  map.scrollZoom.disable();

  // Add zoom and rotation controls to the map.
  map.addControl(new maplibregl.NavigationControl(), "top-left");

  // Decade files with paths
  const decadeFiles = {
    1950: "data/01.json",
    1960: "data/02.json",
    1970: "data/3.5.json",
    1980: "data/03.json",
    1990: "data/04.json",
    2000: "data/05.json",
    2010: "data/06.json",
    2020: "data/07.json",
    2030: "data/08.json",
    2040: "data/09.json",
    2050: "data/10.json",
    2060: "data/11.json",
    2070: "data/12.json",
    // Add more decades as needed
  };

  let currentDecade = 1950; // Start with the initial decade

  // Function to update the GeoJSON source
  const updateGeoJSONSource = (decade) => {
    fetch(decadeFiles[decade])
      .then((response) => response.json())
      .then((data) => {
        const layerId = `polygon-${decade}`;

        // Add a new layer for the new decade
        map.addSource(layerId, {
          type: "geojson",
          data: data,
        });

        map.addLayer({
          id: layerId,
          type: "fill",
          source: layerId,
          layout: {},
          paint: {
            "fill-color": "#A5091E",
            "fill-opacity": 0.3,
          },
        });

        // Extract date and time from the data
        const dateTime =
          data.features.length > 0
            ? data.features[0].properties.PROG_DATETIME
            : "";
        const dateTimeFormatted = formatDateTime(dateTime);

        // Update slider label with date and time
        document.getElementById("slider-label").innerText = dateTimeFormatted;

        // Update the current decade
        currentDecade = decade;
      })
      .catch((error) => console.error("Error loading GeoJSON:", error));
  };

  const formatDateTime = (dateTime) => {
    if (!dateTime) return "No Data";

    const date = new Date(dateTime);

    // Create a formatter for Los Angeles time zone
    const formatter = new Intl.DateTimeFormat("en-US", {
      month: "long",
      day: "numeric",
      hour: "numeric",
      minute: "numeric",
      hour12: true,
      timeZone: "America/Los_Angeles",
      timeZoneName: "short",
    });

    const formattedDate = formatter.format(date);

    // Replace time zone abbreviation with 'PST'
    return formattedDate.replace(/(?:\s[A-Z]{2,3})$/, " PST");
  };

  // Function to remove the layer
  const removeLayer = (decade) => {
    const layerId = `polygon-${decade}`;
    if (map.getLayer(layerId)) {
      map.removeLayer(layerId);
      map.removeSource(layerId);
    }
  };

  // Initial load
  map.on("load", () => {
    updateGeoJSONSource(currentDecade);
  });

  // Update map when slider changes
  document.getElementById("slider").addEventListener("input", (event) => {
    const decade = parseInt(event.target.value);
    const isDraggingBackward = decade < currentDecade;

    if (isDraggingBackward) {
      // Remove the previous layer if dragging backward
      removeLayer(currentDecade);
    }

    // Update the map with the new decade layer
    updateGeoJSONSource(decade);
  });

  // Play/Pause functionality
  let isPlaying = false;
  let playInterval;

  const playPauseButton = document.getElementById("play-pause");
  const playIcon = '<i class="fas fa-play"></i>';
  const pauseIcon = '<i class="fas fa-pause"></i>';

  const play = () => {
    isPlaying = true;
    playPauseButton.innerHTML = pauseIcon;
    playInterval = setInterval(() => {
      const slider = document.getElementById("slider");
      let currentDecade = parseInt(slider.value);
      if (currentDecade < 2020) {
        currentDecade += 10;
        slider.value = currentDecade;
        document.getElementById(
          "slider-label"
        ).textContent = `${currentDecade}s`;
        updateGeoJSONSource(currentDecade);
      } else {
        clearInterval(playInterval);
        playPauseButton.innerHTML = playIcon;
        isPlaying = false;
      }
    }, 2000);
  };

  const pause = () => {
    isPlaying = false;
    playPauseButton.innerHTML = playIcon;
    clearInterval(playInterval);
  };

  playPauseButton.addEventListener("click", () => {
    if (isPlaying) {
      pause();
    } else {
      play();
    }
  });

  document.addEventListener("DOMContentLoaded", function () {
    var pymChild = new pym.Child();
    pymChild.sendHeight();
  });
</script>
